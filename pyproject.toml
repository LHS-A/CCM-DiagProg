[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccm-diagprog"
version = "0.2.0"
description = "Unified prior-guided and patient-adaptive framework for corneal confocal microscopy analysis"
requires-python = ">=3.8"
dependencies = [
  "joblib>=1.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.30",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
