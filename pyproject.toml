[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccm-diagprog"
version = "0.1.0"
description = "Unified Causal-CCM diagnosis and prognosis framework"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.30",
]

[project.optional-dependencies]
complexity = ["fvcore>=0.1.5", "thop>=0.1.1"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
