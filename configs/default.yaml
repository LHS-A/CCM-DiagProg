project:
  dataset_root: Dataset
  artifacts_root: artifacts
  results_root: results
  checkpoints_root: checkpoints
  audit_root: data_audit

data:
  input_resolution: 384
  split_ratio: [0.6, 0.2, 0.2]
  candidate_seeds: [3407, 7819, 12037, 24071, 42139]
  num_workers: 4
  strict_audit: true
  allow_incomplete_targets: false

model:
  visual_backbone: resnet50
  pretrained_visual: true
  clinical_encoder: nlpie/tiny-clinicalbert
  patient_semantic_dim: 768
  clinical_missingness_eval: 0.0
  max_sequence_length: 128
  attention_dim: 256
  attention_heads: 8
  task_embedding_dim: 32
  hyper_input_dim: 800
  hyper_trunk_dims: [512, 256]
  hyper_hidden_dim: 256
  generator_hidden_dim: 256
  task_count: 6
  retained_channel_ratio:
    ocular_diag: 0.30
    systemic_diag: 0.30
    ocular_reg: 0.30
    hba1c_reg: 0.30
    short_term: 0.30
    long_term: 0.30
  structural_loss_weight: 1.0
  hyper_loss_weight: 5.0e-4
  relation_bootstrap_resamples: 1000
  filtering_permutation_resamples: 1000
  nmi_neighbors: 5
  kci_gcv_min: 1.0e-6
  kci_gcv_max: 1.0e1
  kci_gcv_candidates: 50
  filtering_fdr: 0.05
  filtering_max_samples: null

training:
  batch_size: 16
  max_epochs: 500
  warmup_max_epochs: 100
  relation_alignment_max_epochs: 100
  checkpoint_interval_epochs: 10
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  early_stopping:
    patience: 20
    min_delta: 0.0

tasks:
  task1:
    name: Ocular neuroimmune diagnosis
    kind: classification
    dataset_dir: DED-NCP
    classes: [HC, DED, NCP]
    output_dim: 3
    expected_internal_images: 5425
    expected_internal_patients: 518
    expected_external_images: 3522
    expected_external_patients: 378
    primary_metric: macro_auc
    secondary_metric: accuracy
    maximize: true
    clinical_exclude: [label, class_name, diagnosis, DED, NCP]
    clinical_available_fields: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score]
    clinical_field_types: {label: nominal, age: continuous, sex: nominal, DM_Duration_Years: continuous, HTN_Duration_Years: continuous, Pain_Score: continuous}
  task2:
    name: Systemic small-fiber neuropathy diagnosis
    kind: classification
    dataset_dir: NODPN-DPN
    classes: [HC, DPN-, DPN+]
    folder_aliases: {DPN-: NODPN, DPN+: DPN}
    output_dim: 3
    expected_internal_images: 5920
    expected_internal_patients: 277
    expected_external_images: 3832
    expected_external_patients: 224
    primary_metric: macro_auc
    secondary_metric: accuracy
    maximize: true
    clinical_exclude: [label, class_name, diagnosis, NODPN, DPN, DPN-, DPN+]
    clinical_available_fields: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score]
    clinical_field_types: {label: nominal, age: continuous, sex: nominal, DM_Duration_Years: continuous, HTN_Duration_Years: continuous, Pain_Score: continuous}
  task3:
    name: Clinical reference metric regression
    kind: regression
    dataset_dir: MetricsRegression
    targets: [HbA1c, TBUT, CFS, SIT, OSDI]
    output_dim: 5
    expected_internal_images: 5758
    expected_internal_patients: 97
    expected_external_images: 3056
    expected_external_patients: 52
    primary_metric: normalized_mae
    secondary_metric: normalized_rmse
    maximize: false
    clinical_exclude: [HbA1c, CFS, TBUT, SIT, OSDI]
    clinical_field_types: {HbA1c: continuous, CFS: continuous, TBUT: continuous, SIT: continuous, OSDI: continuous, age: continuous, sex: nominal, DM_Duration_Years: continuous, HTN_Duration_Years: continuous, Pain_Score: continuous}
    clinical_exclude_by_identity:
      ocular_reg: [CFS, TBUT, SIT, OSDI, followup_CFS, followup_TBUT, followup_SIT, followup_OSDI]
      hba1c_reg: [HbA1c, glucose, fasting_glucose, random_glucose, estimated_average_glucose]
    clinical_available_by_identity:
      ocular_reg: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score, HbA1c]
      hba1c_reg: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score, CFS, TBUT, SIT, OSDI]
  task4:
    name: Short-term treatment prognosis
    kind: regression
    dataset_dir: ShortTerm
    targets: [TBUT_1m, CFS_1m, SIT_1m, OSDI_1m]
    output_dim: 4
    expected_internal_images: 3518
    expected_internal_patients: 28
    expected_external_images: 1027
    expected_external_patients: 22
    primary_metric: normalized_mae
    secondary_metric: normalized_rmse
    maximize: false
    clinical_exclude: [CFS_1m, TBUT_1m, SIT_1m, OSDI_1m]
    clinical_available_fields: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score, HbA1c, CFS, TBUT, SIT, OSDI]
    clinical_field_types: {CFS_1m: continuous, TBUT_1m: continuous, SIT_1m: continuous, OSDI_1m: continuous, age: continuous, sex: nominal, DM_Duration_Years: continuous, HTN_Duration_Years: continuous, Pain_Score: continuous, HbA1c: continuous, CFS: continuous, TBUT: continuous, SIT: continuous, OSDI: continuous}
  task5:
    name: Long-term postoperative prognosis
    kind: classification
    dataset_dir: LongTerm
    classes: [NPD, PDE]
    folder_aliases: {NPD: Non-persistent, PDE: Persistent}
    output_dim: 2
    expected_internal_images: 1629
    expected_internal_patients: 70
    expected_external_images: 1378
    expected_external_patients: 59
    primary_metric: auc
    secondary_metric: accuracy
    maximize: true
    clinical_exclude: [label, class_name, Persistent, Non-persistent, NPD, PDE, six_month_outcome]
    clinical_available_fields: [age, sex, systemic_status, medical_history, ocular_status, symptom_text, DM_Duration_Years, HTN_Duration_Years, Pain_Score, HbA1c, CFS, TBUT, SIT, OSDI]
    clinical_field_types: {label: nominal, age: continuous, sex: nominal, DM_Duration_Years: continuous, HTN_Duration_Years: continuous, Pain_Score: continuous, HbA1c: continuous, CFS: continuous, TBUT: continuous, SIT: continuous, OSDI: continuous}
