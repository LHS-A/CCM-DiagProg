project:
  dataset_root: Dataset
  artifacts_root: artifacts
  results_root: results
  checkpoints_root: checkpoints
  audit_root: data_audit

data:
  input_resolution: 384
  split_ratio: [0.6, 0.2, 0.2]
  candidate_seeds: [3407, 7819, 12037, 24071, 42139]
  num_workers: 4
  strict_audit: true
  allow_incomplete_targets: false
  # Must be verified from an authoritative construction source before Task 4.
  task4_delta_direction: followup_minus_baseline

model:
  visual_backbone: resnet50
  pretrained_visual: true
  clinical_encoder: emilyalsentzer/Bio_ClinicalBERT
  clinical_missingness_eval: 0.0
  pretrained_text: true
  max_sequence_length: 128
  attention_dim: 256
  task_embedding_dim: 32
  hyper_input_dim: 800
  hyper_trunk_dims: [512, 256]
  hyper_hidden_dim: 256
  generator_hidden_dim: 256
  task_count: 6
  task_loss_weight: 0.16666666666666666
  retained_channel_ratio: 0.30
  structural_temperature: 0.10
  structural_loss_weight: 1.0
  hyper_loss_weight: 5.0e-4
  relation_bootstrap_initial: 50
  relation_bootstrap_increment: 25
  relation_bootstrap_max: 500
  relation_bootstrap_confidence: 0.95
  permutation_min: 200
  permutation_max: 5000
  permutation_confidence: 0.99
  nmi_estimator: knn
  nmi_neighbors: 5
  nmi_normalization: geometric_entropy
  kci_gcv_min: 1.0e-6
  kci_gcv_max: 1.0e1
  kci_gcv_candidates: 50
  screening_fdr: 0.05
  screening_permutations: 100
  screening_max_samples: 256
  kci_regularization: 1.0e-3

training:
  batch_size: 16
  max_epochs: 500
  stage1_epochs: 30
  visual_warmup_epochs: 15
  checkpoint_interval_epochs: 10
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  precision: fp32
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 1.0e-4
    min_epochs: 15

label_sensitivity:
  max_seed_attempts: 500
  initial_seeds: [3407, 7819, 12037, 24071, 42139]
  generated_seed_stride: 7919
  thresholds:
    rmse: 1.3
    mae: 2.0
  target_offsets:
    CFS: 11
    TBUT: 23
    HbA1c: 37
    SIT: 41
    OSDI: 53
    delta_CFS: 11
    delta_TBUT: 23
    delta_SIT: 41
    delta_OSDI: 53

tasks:
  task1:
    name: Ocular neuroimmune diagnosis
    kind: classification
    image_only: true
    dataset_dir: DED-NCP
    classes: [HC, DED, NCP]
    output_dim: 3
    expected_internal_images: 5425
    expected_internal_patients: 518
    expected_external_images: 6122
    expected_external_patients: 678
    primary_metric: macro_auc
    secondary_metric: accuracy
    maximize: true
  task2:
    name: Systemic small-fiber neuropathy diagnosis
    kind: classification
    image_only: true
    dataset_dir: NODPN-DPN
    classes: [HC, NODPN, DPN]
    output_dim: 3
    expected_internal_images: 5894
    expected_internal_patients: 616
    expected_external_images: 5265
    expected_external_patients: 450
    primary_metric: macro_auc
    secondary_metric: accuracy
    maximize: true
  task3:
    name: Clinical reference metric regression
    kind: regression
    dataset_dir: MetricsRegression
    targets: [HbA1c, CFS, TBUT, SIT, OSDI]
    output_dim: 5
    expected_internal_images: 5758
    expected_internal_patients: 97
    expected_external_images: 3056
    expected_external_patients: 52
    primary_metric: normalized_mae
    secondary_metric: normalized_rmse
    maximize: false
  task4:
    name: Short-term treatment prognosis
    kind: regression
    dataset_dir: ShortTerm
    targets: [delta_CFS, delta_TBUT, delta_SIT, delta_OSDI]
    output_dim: 4
    expected_internal_images: 3518
    expected_internal_patients: 39
    expected_external_images: 1027
    expected_external_patients: 11
    primary_metric: normalized_mae
    secondary_metric: normalized_rmse
    maximize: false
  task5:
    name: Long-term postoperative prognosis
    kind: classification
    image_only: true
    dataset_dir: LongTerm
    classes: [Non-persistent, Persistent]
    output_dim: 2
    expected_internal_images: 1629
    expected_internal_patients: 70
    expected_external_images: 1378
    expected_external_patients: 59
    primary_metric: auc
    secondary_metric: accuracy
    maximize: true
